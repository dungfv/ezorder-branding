AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ezorder.io marketing site: private S3 bucket + CloudFront (OAC, URL rewrite
  function, security headers) + IAM role that GitHub Actions assumes via OIDC
  to deploy. The ACM certificate must already exist in us-east-1.

Parameters:
  DomainName:
    Type: String
    Default: ezorder.io
    Description: Apex domain (www.<domain> is added and redirected to it).
  AcmCertificateArn:
    Type: String
    AllowedPattern: '^arn:aws:acm:us-east-1:\d{12}:certificate/.+$'
    Description: ACM certificate in us-east-1 covering the apex and www.
  GitHubRepository:
    Type: String
    AllowedPattern: '^[A-Za-z0-9_.-]+(@[0-9]+)?/[A-Za-z0-9_.-]+(@[0-9]+)?$'
    Description: >
      Repository exactly as it appears in the OIDC "sub" claim. GitHub now issues
      owner@<owner_id>/repo@<repo_id> for many repositories
      (e.g. dungfv@22865175/ezorder-branding@1392203605); older ones use owner/repo.
      Print the claim once (see docs/deploy-aws-console/06) if unsure.
  DeployEnvironment:
    Type: String
    Default: production
    Description: >
      GitHub environment of the deploy job. Restrict it to the main branch in
      GitHub (Settings → Environments → Deployment branches).
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ''
    Description: >
      Leave empty to create the GitHub OIDC provider. An AWS account can hold only
      one provider for token.actions.githubusercontent.com — pass its ARN if it exists.
  PriceClass:
    Type: String
    Default: PriceClass_All
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]

Conditions:
  CreateOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, '']

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # Static-site routing that S3 (REST origin) does not do on its own:
  #   www.<domain>/x  -> 301 https://<domain>/x
  #   /about          -> 301 /about/        (site uses trailingSlash: 'always')
  #   /about/         -> /about/index.html  (internal rewrite)
  UrlRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-url-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: www redirect, trailing slash, index.html rewrite
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function queryString(request) {
          var parts = [];
          var params = request.querystring;
          for (var key in params) {
            var entry = params[key];
            var values = entry.multiValue ? entry.multiValue : [entry];
            for (var i = 0; i < values.length; i++) {
              parts.push(values[i].value === '' ? key : key + '=' + values[i].value);
            }
          }
          return parts.length ? '?' + parts.join('&') : '';
        }

        function redirect(location) {
          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: { location: { value: location } },
          };
        }

        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : '';
          var uri = request.uri;

          if (host.indexOf('www.') === 0) {
            return redirect('https://' + host.substring(4) + uri + queryString(request));
          }

          var lastSegment = uri.substring(uri.lastIndexOf('/') + 1);
          if (lastSegment.indexOf('.') !== -1) {
            return request; // a file: /rss.xml, /_astro/x.css, /pagefind/...
          }
          if (uri.charAt(uri.length - 1) !== '/') {
            return redirect(uri + '/' + queryString(request));
          }
          request.uri = uri + 'index.html';
          return request;
        }

  # Replaces public/_headers from the Cloudflare setup.
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://*.crisp.chat;
              style-src 'self' 'unsafe-inline' https://*.crisp.chat; img-src 'self' data: https://*.crisp.chat;
              font-src 'self' https://*.crisp.chat; media-src 'self' https://*.crisp.chat;
              connect-src 'self' https://*.crisp.chat wss://*.relay.crisp.chat wss://*.relay.rescue.crisp.chat;
              frame-src 'self' https://*.crisp.chat https://*.crisp.help; worker-src 'self' blob: https://*.crisp.chat;
              form-action 'self' mailto: https://formspree.io https://api.web3forms.com;
              frame-ancestors 'none'; base-uri 'self'; object-src 'none'
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: camera=(), microphone=(), geolocation=(), payment=()
              Override: true
            - Header: Cross-Origin-Opener-Policy
              Value: same-origin
              Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${DomainName} marketing site'
        Aliases:
          - !Ref DomainName
          - !Sub 'www.${DomainName}'
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        DefaultRootObject: index.html
        Origins:
          - Id: site-bucket
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed "CachingOptimized": honours the Cache-Control set at upload time
          # (immutable for /_astro/*, s-maxage + invalidation for HTML).
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlRewriteFunction.FunctionMetadata.FunctionARN
        # With OAC, a missing object comes back as 403: serve the 404 page for both.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'Deploys ${DomainName} from ${GitHubRepository} (environment ${DeployEnvironment})'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !GetAtt GitHubOidcProvider.Arn
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Jobs with `environment: <DeployEnvironment>` send this subject. The
                # environment's branch rule (main only) keeps other branches out.
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepository}:environment:${DeployEnvironment}'
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${SiteBucket.Arn}/*'
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  BucketName:
    Description: GitHub variable S3_BUCKET
    Value: !Ref SiteBucket
  DistributionId:
    Description: GitHub variable CLOUDFRONT_DISTRIBUTION_ID
    Value: !Ref Distribution
  DistributionDomainName:
    Description: Point the apex and www ALIAS records here (test the site on it first)
    Value: !GetAtt Distribution.DomainName
  DeployRoleArn:
    Description: GitHub variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn
